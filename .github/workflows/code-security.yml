name: Security (cargo-audit)

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths:
      - "app/**"
      - "rust-toolchain.toml"
      - ".github/workflows/code-security.yml"
  push:
    branches: [main]
    paths:
      - "app/**"
      - "rust-toolchain.toml"
      - ".github/workflows/code-security.yml"
  schedule:
    - cron: "46 3 1 * *"  # monthly scattered (was: 0 9 * * 1)

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  cargo-audit:
    permissions:
      contents: read
    uses: FelipeFuhr/ffreis-workflows-rust/.github/workflows/rust-security.yml@611209c22f92a16917b4745e3fea018899234be2 # v1.3.0
    with:
      working-directory: "app"
      ignore-advisories: "RUSTSEC-2026-0009"
