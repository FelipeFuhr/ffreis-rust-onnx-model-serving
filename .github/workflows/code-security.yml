name: Security (cargo-audit)

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths:
      - "app/**"
      - "rust-toolchain.toml"
      - ".github/workflows/code-security.yml"
  push:
    branches: [main]
    paths:
      - "app/**"
      - "rust-toolchain.toml"
      - ".github/workflows/code-security.yml"
  schedule:
    - cron: "46 3 1 * *"  # monthly scattered (was: 0 9 * * 1)

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  cargo-audit:
    permissions:
      contents: read
    uses: FelipeFuhr/ffreis-workflows-rust/.github/workflows/rust-security.yml@e2a67d8ddcc1921e9bbffadc20a54fc9dd8ad09d # v2.2.0
    with:
      # Explicit because ffreis-workflows-rust v2.0.0 flipped this
      # input's default to [self-hosted, local], and this repo's owner
      # has no self-hosted runners — the job would queue forever.
      runner: '["ubuntu-latest"]'
      working-directory: "app"
      ignore-advisories: "RUSTSEC-2026-0009"
