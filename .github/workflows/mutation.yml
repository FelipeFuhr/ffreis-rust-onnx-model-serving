name: Mutation Testing (cargo-mutants)

# Mutation testing is slow (15-90 min). Do NOT run on every PR.
# - workflow_dispatch: manual trigger from the Actions UI
# - schedule: Sunday 03:00 UTC weekly
on:
  workflow_dispatch:
  schedule:
    - cron: "13 11 11 * *"  # monthly scattered (was: 0 3 * * 0)

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mutation:
    permissions:
      contents: read
    uses: FelipeFuhr/ffreis-workflows-rust/.github/workflows/rust-mutation.yml@611209c22f92a16917b4745e3fea018899234be2 # v1.3.0
    with:
      # scan-fix(ci:oom): light tier is a 2Gi pod; cargo-mutants rebuilds the
      # crate once per mutant and the GitHub runner agent shares the pod
      # cgroup with the build, so the agent itself gets OOM-killed mid-run.
      # Surfaces as "the self-hosted runner lost communication with the
      # server" + BlobNotFound logs — not a mutation-score failure, the job
      # never reaches its scoring step. xl (8Gi) fits cargo-mutants' actual
      # footprint and scales to zero when idle, same as light.
      runner: '["self-hosted","local","xl"]'
      working-directory: app
      # Start permissive — get a first green baseline, then raise.
      # The app crate has 64 unit + 24 async + integration + e2e tests,
      # so it should comfortably exceed 60 once the first run completes.
      threshold: 60
      # Restrict to the main app crate; integration-tests/e2e tests are
      # already run as the corpus that catches mutants.
      mutants-args: "-p app"
      # cargo-mutants per worker rebuilds the workspace; cap parallelism
      # to keep memory pressure low on the GH runner.
      jobs: 2
      timeout-minutes: 90
