name: Code Quality (SonarCloud)

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "**/*.rs"
      - "Cargo.toml"
      - "Cargo.lock"
      - "sonar-project.properties"
      - ".github/workflows/**"
  push:
    branches: [main]
    paths:
      - "**/*.rs"
      - "Cargo.toml"
      - "Cargo.lock"
      - "sonar-project.properties"
      - ".github/workflows/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sonar:
    if: ${{ !github.event.pull_request.draft && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false) }}
    permissions:
      contents: read
    uses: FelipeFuhr/ffreis-workflows-rust/.github/workflows/rust-sonar.yml@e2a67d8ddcc1921e9bbffadc20a54fc9dd8ad09d # v2.2.0
    with:
      # Explicit because ffreis-workflows-rust v2.0.0 flipped this
      # input's default to [self-hosted, local], and this repo's owner
      # has no self-hosted runners — the job would queue forever.
      runner: '["ubuntu-latest"]'
      working-directory: .
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
