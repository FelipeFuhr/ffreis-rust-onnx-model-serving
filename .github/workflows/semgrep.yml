name: Security - SAST (Semgrep)

on:
  workflow_dispatch:
  schedule:
    - cron: "20 4 8 * *"  # monthly scattered (was: 0 8 * * 1)

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    permissions:
      contents: read
    uses: FelipeFuhr/ffreis-workflows-rust/.github/workflows/rust-semgrep.yml@e2a67d8ddcc1921e9bbffadc20a54fc9dd8ad09d # v2.2.0
    with:
      # Explicit because ffreis-workflows-rust v2.0.0 flipped this
      # input's default to [self-hosted, local], and this repo's owner
      # has no self-hosted runners — the job would queue forever.
      runner: '["ubuntu-latest"]'
